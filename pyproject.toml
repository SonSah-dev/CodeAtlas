[project]
name = "codeatlas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SonSah-dev", email = "sona.sahakiann@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
codeatlas = "codeatlas:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]
